<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Shop Logs</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',Cascadia Code,Consolas,monospace;background:#0d1117;color:#c9d1d9;height:100vh;display:flex}
aside{width:260px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;overflow-y:auto}
aside h1{padding:18px 16px;font-size:14px;font-weight:700;color:#f0f6fc;letter-spacing:2px;border-bottom:1px solid #21262d}
aside nav{flex-shrink:0;padding:8px}
aside nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;border:none;cursor:pointer;font:12px inherit;background:transparent;color:#8b949e;margin-bottom:2px;text-align:left;transition:all .15s}
aside nav button:hover{background:#1f2937;color:#f0f6fc}
aside nav button.active{background:#1f2937;color:#f0f6fc}
aside .dot{width:22px;height:22px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
aside .status{padding:4px 16px 6px;display:flex;align-items:center;gap:6px;font-size:10px;color:#8b949e}
aside .status span.d{width:7px;height:7px;border-radius:50%;display:inline-block}
aside section{padding:8px 16px;border-top:1px solid #21262d}
aside section h3{font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
aside .time-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
aside .time-row button{padding:4px 8px;border-radius:4px;border:1px solid #30363d;background:transparent;color:#8b949e;cursor:pointer;font:10px inherit;transition:all .15s}
aside .time-row button:hover{background:#1f2937;color:#f0f6fc}
aside .time-row button.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
aside .custom-dates{display:flex;flex-direction:column;gap:4px}
aside .custom-dates input{padding:4px 6px;border-radius:4px;border:1px solid #30363d;background:#0d1117;color:#c9d1d9;font:10px inherit;width:100%}
aside .custom-dates input:focus{outline:none;border-color:#58a6ff}
aside .custom-dates button{padding:4px 0;border-radius:4px;border:1px solid #30363d;background:transparent;color:#c9d1d9;cursor:pointer;font:10px inherit;width:100%;margin-top:2px}
aside .custom-dates button:hover{background:#1f2937}
aside footer{padding:8px 16px;border-top:1px solid #21262d;display:flex;flex-direction:column;gap:6px;font-size:11px;flex-shrink:0}
aside footer label{display:flex;align-items:center;gap:8px;color:#8b949e;cursor:pointer;font-size:11px}
aside footer select, aside footer button{padding:6px 10px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#c9d1d9;cursor:pointer;font:11px inherit;width:100%}
aside footer select{background:#161b22}
aside footer select option{background:#161b22;color:#c9d1d9}
aside footer button:hover{background:#1f2937}
.lvl label{cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0}
.lvl label input[type=radio]{accent-color:#58a6ff}
main{flex:1;overflow:auto;display:flex;flex-direction:column}
main header{position:sticky;top:0;background:#0d1117;padding:12px 16px 8px;border-bottom:1px solid #21262d;z-index:1;display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:8px}
main header .count{color:#8b949e;font-size:11px}
#log{flex:1;padding:6px 16px;overflow-y:auto}
.line{padding:2px 0;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-all;border-bottom:1px solid #161b22;font-family:inherit;display:flex;gap:6px}
.line.error{color:#f85149}.line.warn{color:#d29922}.line.info{color:#58a6ff}.line.http{color:#7ee787}
.line.sql{color:#bc8cff}.line.debug{color:#8b949e}.line.unknown{color:#484f58}
.line .svc{width:14px;height:14px;border-radius:3px;flex-shrink:0;margin-top:2px;opacity:.7}
.lvl-badge{display:inline-block;width:48px;text-align:center;font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px;margin-right:8px;flex-shrink:0}
.lvl-error{background:#f8514920;color:#f85149}.lvl-warn{background:#d2992220;color:#d29922}.lvl-info{background:#58a6ff20;color:#58a6ff}
.lvl-http{background:#7ee78720;color:#7ee787}.lvl-sql{background:#bc8cff20;color:#bc8cff}.lvl-debug{background:#8b949e20;color:#8b949e}
.lvl-unknown{background:#484f5820;color:#484f58}
.no-logs{display:flex;align-items:center;justify-content:center;height:100%;color:#484f58;font-size:14px}
</style>
</head>
<body>
<aside>
  <h1>SHOP LOGS</h1>
  <div class="status"><span class="d" id="dot"></span><span id="statusText">Connecting...</span></div>
  <nav id="nav"></nav>
  <section>
    <h3>Rango de tiempo</h3>
    <div class="time-row" id="timeRow">
      <button data-range="3600000">1h</button>
      <button data-range="10800000">3h</button>
      <button data-range="25200000">7h</button>
      <button data-range="86400000">24h</button>
      <button data-range="259200000">3d</button>
      <button data-range="604800000">7d</button>
      <button data-range="0">Todo</button>
    </div>
    <div class="custom-dates">
      <input type="datetime-local" id="dateFrom" placeholder="Desde">
      <input type="datetime-local" id="dateTo" placeholder="Hasta">
      <button id="applyCustom">Aplicar rango</button>
    </div>
  </section>
  <footer>
    <label style="font-weight:600;color:#f0f6fc;margin-bottom:2px">Filtrar nivel</label>
    <div class="lvl">
      <label><input type="radio" name="level" value="ALL" checked onchange="changeLevel('ALL')"> Todos</label>
      <label><input type="radio" name="level" value="ERROR" onchange="changeLevel('ERROR')"> Error</label>
      <label><input type="radio" name="level" value="WARN" onchange="changeLevel('WARN')"> Warning</label>
      <label><input type="radio" name="level" value="INFO" onchange="changeLevel('INFO')"> Info</label>
      <label><input type="radio" name="level" value="HTTP" onchange="changeLevel('HTTP')"> HTTP</label>
      <label><input type="radio" name="level" value="SQL" onchange="changeLevel('SQL')"> SQL</label>
    </div>
    <label style="margin-top:4px"><input type="checkbox" id="autoscroll" checked> Auto-scroll</label>
    <button id="pauseBtn">⏸ Pausar</button>
    <button id="clearBtn">✕ Limpiar</button>
    <select id="tailSelect" onchange="reconnect()">
      <option value="100">100 lineas</option>
      <option value="200" selected>200 lineas</option>
      <option value="500">500 lineas</option>
      <option value="1000">1000 lineas</option>
    </select>
  </footer>
</aside>
<main>
  <header><span id="title">Shop API</span><input type="text" id="searchInput" placeholder="Buscar en logs..." oninput="filterLogs()" style="background:#161b22;border:1px solid #30363d;border-radius:6px;padding:4px 10px;color:#c9d1d9;font:11px inherit;width:200px;outline:none"><span id="live" style="color:#10b981;font-size:10px;font-weight:600">● LIVE</span><span class="count" id="count">0 lineas</span></header>
  <div id="log"><div class="no-logs">Esperando logs...</div></div>
</main>
<script>
const SERVICES = [
  { id:'shop-api', name:'Shop API', color:'#6366f1', icon:'S' },
  { id:'auth-api', name:'Auth API', color:'#10b981', icon:'A' },
  { id:'shop-postgres', name:'Shop DB', color:'#f59e0b', icon:'P' },
  { id:'auth-postgres', name:'Auth DB', color:'#ec4899', icon:'D' },
];
const svcColors = {};
SERVICES.forEach(s=>{ svcColors[s.id]=s.color; });

let selected='shop-api', ws, paused=false, currentLevel='ALL', lineCount=0, timeRange=null, timeFrom=null, timeTo=null;
const log = document.getElementById('log');
const title = document.getElementById('title');
const live = document.getElementById('live');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const count = document.getElementById('count');

const LBL={ERROR:'ERR',WARN:'WRN',INFO:'INF',HTTP:'HTTP',SQL:'SQL',DEBUG:'DBG',UNKNOWN:'---'};

function connect(service){
  if(ws){try{ws.close()}catch(e){}}
  log.innerHTML='<div class=no-logs>Cargando historico...</div>';
  lineCount=0;count.textContent='0 lineas';
  live.innerHTML='● LIVE';live.style.color='#10b981';
  const proto=location.protocol==='https:'?'wss':'ws';
  const tail=document.getElementById('tailSelect').value||200;
  ws=new WebSocket(`${proto}://${location.host}/ws?service=${service}&tail=${tail}&level=${currentLevel}`);
  ws.onopen=()=>{dot.style.background='#10b981';statusText.textContent='Live'; fetchHistorical(service);};
  ws.onclose=()=>{dot.style.background='#ef4444';statusText.textContent='Offline'};
  ws.onmessage=(e)=>{
    try{
      const d=JSON.parse(e.data);
      if(d.error)return;
      if(timeFrom&&d.ts&&d.ts<timeFrom)return;
      if(timeTo&&d.ts&&d.ts>timeTo)return;
      if(log.querySelector('.no-logs'))log.innerHTML='';
      lineCount++;
      count.textContent=lineCount+' lineas';
      appendLine(d);
    }catch(e){}
  };
}

function appendLine(d, prepend=false){
  const div=document.createElement('div');
  const lvl=(d.level||'UNKNOWN').toLowerCase();
  div.className='line '+lvl;
  const lvlClass='lvl-'+lvl;
  const color=svcColors[d.service]||'#484f58';
  div.innerHTML='<span class="svc" style="background:'+color+'" title="'+escapeHtml(d.service||'')+'"></span><span class="lvl-badge '+lvlClass+'">'+(LBL[d.level||'UNKNOWN']||'---')+'</span>'+escapeHtml(d.message||'');
  if(prepend) log.insertBefore(div, log.firstChild);
  else log.appendChild(div);
}

async function fetchHistorical(service){
  const params=new URLSearchParams();
  const tail=document.getElementById('tailSelect').value||500;
  params.set('tail', tail);
  if(timeFrom){ params.set('since', Math.floor(timeFrom/1000)); params.set('sinceMin', timeFrom); }
  if(timeTo){ params.set('until', Math.floor(timeTo/1000)); params.set('untilMax', timeTo); }
  try{
    const r=await fetch('/api/logs/'+service+'?'+params);
    const lines=await r.json();
    if(!lines.length){ if(log.querySelector('.no-logs')) log.innerHTML='<div class=no-logs>Sin logs en este rango</div>'; return; }
    if(log.querySelector('.no-logs'))log.innerHTML='';
    lines.forEach(d=>{ lineCount++; appendLine(d, true); });
    count.textContent=lineCount+' lineas';
  }catch(e){ if(log.querySelector('.no-logs')) log.innerHTML='<div class=no-logs>Error al cargar</div>'; }
}

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function changeLevel(l){currentLevel=l;reconnect();}
function reconnect(){if(!paused)connect(selected);}
function filterLogs(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#log .line').forEach(el=>{
    el.style.display = !q || el.textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function setTimeRange(ms, btn){
  document.querySelectorAll('#timeRow button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  timeRange=ms;
  timeTo=Date.now();
  timeFrom=ms?timeTo-ms:null;
  if(!ms){ document.getElementById('dateFrom').value=''; document.getElementById('dateTo').value=''; }
  if(!paused)connect(selected);
}

document.getElementById('dateTo').valueAsDate=new Date();

document.getElementById('timeRow').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>setTimeRange(parseInt(b.dataset.range), b);
});

document.getElementById('applyCustom').onclick=()=>{
  const from=document.getElementById('dateFrom').value;
  const to=document.getElementById('dateTo').value;
  if(!from&&!to)return;
  document.querySelectorAll('#timeRow button').forEach(b=>b.classList.remove('active'));
  timeRange=null; timeFrom=from?new Date(from).getTime():null; timeTo=to?new Date(to).getTime():null;
  if(!paused)connect(selected);
};

const nav=document.getElementById('nav');
SERVICES.forEach(s=>{
  const btn=document.createElement('button');
  btn.innerHTML='<span class="dot" style="background:'+s.color+'">'+s.icon+'</span>'+s.name;
  btn.onclick=()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selected=s.id;title.textContent=s.name;paused=false;live.style.display='';
    document.getElementById('pauseBtn').textContent='\u23F8 Pausar';
    connect(s.id);
  };
  nav.appendChild(btn);
});
nav.firstChild?.classList.add('active');

document.getElementById('pauseBtn').onclick=function(){
  paused=!paused;
  this.textContent=paused?'\u25B6 Reanudar':'\u23F8 Pausar';
  live.style.display=paused?'none':'';
  if(paused)ws?.close();
  else connect(selected);
};
document.getElementById('clearBtn').onclick=()=>{log.innerHTML='<div class=no-logs>Limpiado</div>';lineCount=0;count.textContent='0 lineas'};

connect('shop-api');
</script>
</body>
</html>
