name: CI - Tests & Build

on:
  push:
    branches: [main]
    paths:
      - 'shop-api/**'
      - 'shop-auth/**'
      - 'shop-store/src/**'
      - 'shop-backoffice/src/**'
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Shop.sln
      - run: dotnet test Shop.UnitTests/Shop.UnitTests.csproj --no-restore --verbosity normal
      - name: Auth Tests
        run: |
          cd ../shop-auth
          dotnet restore Shop.Auth.sln
          dotnet test Auth.UnitTests/Auth.UnitTests.csproj --no-restore --verbosity normal

  frontend-store-tests:
    name: Store Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm test

  frontend-backoffice-tests:
    name: Backoffice Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop-backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm test

  frontend-builds:
    name: Frontend Builds
    runs-on: ubuntu-latest
    needs: [frontend-store-tests, frontend-backoffice-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd shop-store && npm install --legacy-peer-deps && npm run build
      - run: cd shop-backoffice && npm install --legacy-peer-deps && npm run build
