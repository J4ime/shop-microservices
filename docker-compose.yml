version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppass123
    ports:
      - "5433:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-api:
    build:
      context: ./Shop.Auth
      dockerfile: Dockerfile
    container_name: auth-api
    ports:
      - "6001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=auth-db;Port=5432;Database=authdb;Username=shopuser;Password=shoppass123
      - Jwt__Key=AuthDefaultKey1234567890!@#$%^&*()
      - Jwt__Issuer=https://auth.shop.com
      - Jwt__Audience=shop-services
      - Jwt__AccessTokenExpiryMinutes=60
      - Jwt__RefreshTokenExpiryDays=7
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - shop-network

  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=shopdb;Username=shopuser;Password=shoppass123
      - Jwt__Issuer=https://auth.shop.com
      - Jwt__Audience=shop-services
      - Jwt__Key=AuthDefaultKey1234567890!@#$%^&*()
      - AuthService__ValidationUrl=http://auth-api:8080/api/auth/validate
    depends_on:
      postgres:
        condition: service_healthy
      auth-api:
        condition: service_started
    networks:
      - shop-network

volumes:
  postgres-data:
  auth-data:

networks:
  shop-network:
    driver: bridge
